<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>MIRIM WMS PRO</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:24px 18px 28px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;opacity:.85}
main{max-width:760px;margin:-12px auto 40px;padding:0 14px}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #0f172a14}
.search{display:flex;gap:8px}input,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700}.primary{background:#2563eb;color:#fff}.ghost{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}
.result{border-left:5px solid #2563eb}.loc{font-size:30px;font-weight:900;color:#1d4ed8;margin:5px 0}.meta{color:#64748b;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-size:13px;font-weight:700}.hidden{display:none!important}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item-row{padding:12px 0;border-bottom:1px solid #e2e8f0}.small{font-size:13px;color:#64748b}.toolbar{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:600px){.toolbar{grid-template-columns:repeat(4,1fr)}}footer{text-align:center;color:#64748b;font-size:12px;padding:18px}
</style></head><body>
<header><h1>📦 MIRIM WMS PRO</h1><p>검색은 3초, 관리는 한 번.</p></header><main>
<section class="card"><div class="search"><input id="q" placeholder="품번 · 품명 · 제조사 · 위치 검색"><button class="primary" onclick="searchItems()">검색</button></div><div class="small" style="margin-top:9px">일반 사용자는 검색만 가능합니다.</div></section>
<section id="results"></section>
<section class="card"><div class="admin-head"><div><b>🔐 관리자</b><div class="small">추가·수정·삭제·Excel 내보내기</div></div><button class="ghost" onclick="toggleLogin()">로그인</button></div>
<div id="loginBox" class="hidden" style="margin-top:12px"><div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="관리자 PIN"><button class="primary" onclick="login()">확인</button></div><div class="small" style="margin-top:7px">초기 PIN: 1234 · 로그인 후 변경 가능</div></div></section>
<section id="adminPanel" class="hidden"><div class="card"><div class="admin-head"><b>관리자 메뉴</b><button class="ghost" onclick="logout()">로그아웃</button></div><div class="toolbar" style="margin-top:12px">
<button class="primary" onclick="openForm()">➕ 품목 추가</button><button class="ghost" onclick="exportExcel()">📤 Excel 내보내기</button><button class="ghost" onclick="document.getElementById('csvFile').click()">📥 CSV 가져오기</button><button class="ghost" onclick="changePin()">🔑 PIN 변경</button></div>
<input id="csvFile" class="hidden" type="file" accept=".csv,text/csv" onchange="importCSV(event)"></div>
<div id="editCard" class="card hidden"><b id="formTitle">품목 추가</b><div style="height:10px"></div><input id="fPart" placeholder="품번 *"><div style="height:8px"></div><input id="fName" placeholder="품명"><div style="height:8px"></div><input id="fMaker" placeholder="제조사"><div style="height:8px"></div><input id="fLoc" placeholder="위치코드 *"><div style="height:8px"></div><textarea id="fNote" placeholder="비고"></textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="saveItem()">저장</button><button class="ghost" onclick="closeForm()">취소</button></div></div>
<div class="card"><b>등록 품목</b><div id="adminList"></div></div></section></main>
<footer>데이터는 이 기기의 브라우저에 저장됩니다. 정기적으로 Excel 파일로 백업하세요.</footer>
<script>
const safeStore={
  get(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{window.localStorage.setItem(k,v);return true}catch(e){return false}}
};
const seed=[{"part": "208470-1", "name": "TE Connector", "maker": "TE", "location": "E-2단-003", "note": "사진 확인"}, {"part": "208472-1", "name": "TE Connector", "maker": "TE", "location": "E-2단-003", "note": "사진 확인"}, {"part": "208473-1", "name": "TE Connector", "maker": "TE", "location": "E-2단-003", "note": "사진 확인"}, {"part": "3399-7626", "name": "커넥터", "maker": "3M", "location": "E-1단-003", "note": "사진 확인"}, {"part": "1003-0029-0001", "name": "커넥터", "maker": "3M", "location": "E-1단-004", "note": "사진 확인"}, {"part": "1500270-2", "name": "확인 필요", "maker": "확인 필요", "location": "E-2단-002", "note": "⚠️ 품명 확인 필요"}, {"part": "LV-N11N", "name": "센서", "maker": "KEYENCE", "location": "E-2단-001", "note": "사진 확인"}, {"part": "FS-T1", "name": "센서", "maker": "KEYENCE", "location": "E-2단-001", "note": "사진 확인"}, {"part": "SYJA522-M5", "name": "공압밸브", "maker": "SMC", "location": "E-1단-002", "note": "사진 확인"}, {"part": "XN-4005-5297-4", "name": "D Sub Socket Connector", "maker": "3M", "location": "E-1단-001", "note": "사진 확인"}, {"part": "DQBC-F-8N-R-SA", "name": "커넥터", "maker": "DK-LOK", "location": "E-1단-003", "note": "사진 확인"}, {"part": "DQVSC-F-8N-SA", "name": "커넥터", "maker": "DK-LOK", "location": "E-1단-003", "note": "사진 확인"}, {"part": "KQ2C07-00A", "name": "피팅", "maker": "SMC", "location": "E-1단-004", "note": "사진 확인"}, {"part": "VQZ312-5LJ1-N7T", "name": "밸브", "maker": "SMC", "location": "E-1단-004", "note": "사진 확인"}, {"part": "231-304/107-000", "name": "커넥터", "maker": "WAGO", "location": "E-2단-003", "note": "사진 확인"}, {"part": "734-105/107-000", "name": "커넥터", "maker": "WAGO", "location": "E-2단-003", "note": "사진 확인"}];let items;try{items=JSON.parse(safeStore.get('mirim_items')||'null')||seed}catch(e){items=seed.slice()}let editIndex=-1;let adminPin=safeStore.get('mirim_pin')||'1234';
function persist(){safeStore.set('mirim_items',JSON.stringify(items))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function searchItems(){const q=document.getElementById('q').value.trim().toLowerCase();const list=q?items.filter(x=>[x.part,x.name,x.maker,x.location].some(v=>String(v||'').toLowerCase().includes(q))):items.slice(0,8);const box=document.getElementById('results');if(!list.length){box.innerHTML='<section class="card result"><div style="font-size:20px;font-weight:800">⚠️ 등록되지 않은 품번입니다.</div><div class="meta" style="margin-top:8px">관리자 로그인 후 품목과 위치를 먼저 추가하세요.</div></section>';return}box.innerHTML=list.map(x=>`<section class="card result"><span class="badge">${esc(x.part)}</span><div class="loc">${esc(x.location)}</div><div><b>${esc(x.name||'확인 필요')}</b></div><div class="meta">제조사: ${esc(x.maker||'확인 필요')}<br>비고: ${esc(x.note||'-')}</div></section>`).join('')}
function toggleLogin(){document.getElementById('loginBox').classList.toggle('hidden')}
function login(){if(document.getElementById('pin').value===adminPin){document.getElementById('adminPanel').classList.remove('hidden');document.getElementById('loginBox').classList.add('hidden');renderAdmin()}else alert('PIN이 맞지 않습니다.')}
function logout(){document.getElementById('adminPanel').classList.add('hidden')}
function changePin(){const n=prompt('새 PIN을 4자리 이상 입력하세요.');if(n&&n.length>=4){adminPin=n;safeStore.set('mirim_pin',n);alert('PIN이 변경되었습니다.')}}
function openForm(i=-1){editIndex=i;document.getElementById('editCard').classList.remove('hidden');document.getElementById('formTitle').textContent=i<0?'품목 추가':'품목 수정';const x=i<0?{part:'',name:'',maker:'',location:'',note:''}:items[i];document.getElementById('fPart').value=x.part||'';document.getElementById('fName').value=x.name||'';document.getElementById('fMaker').value=x.maker||'';document.getElementById('fLoc').value=x.location||'';document.getElementById('fNote').value=x.note||''}
function closeForm(){document.getElementById('editCard').classList.add('hidden')}
function saveItem(){const x={part:document.getElementById('fPart').value.trim(),name:document.getElementById('fName').value.trim()||'확인 필요',maker:document.getElementById('fMaker').value.trim()||'확인 필요',location:document.getElementById('fLoc').value.trim(),note:document.getElementById('fNote').value.trim()};if(!x.part||!x.location){alert('품번과 위치는 필수입니다.');return}const d=items.findIndex((v,j)=>v.part.toLowerCase()===x.part.toLowerCase()&&j!==editIndex);if(d>=0){alert('동일한 품번이 이미 등록되어 있습니다.');return}if(editIndex<0)items.unshift(x);else items[editIndex]=x;persist();renderAdmin();searchItems();closeForm()}
function delItem(i){if(confirm('정말 삭제하시겠습니까?\n품번: '+items[i].part)){items.splice(i,1);persist();renderAdmin();searchItems()}}
function renderAdmin(){document.getElementById('adminList').innerHTML=items.map((x,i)=>`<div class="item-row"><b>${esc(x.part)}</b> · <span>${esc(x.location)}</span><div class="small">${esc(x.name)} / ${esc(x.maker)}</div><div class="row" style="margin-top:7px"><button class="ghost" onclick="openForm(${i})">수정</button><button class="danger" onclick="delItem(${i})">삭제</button></div></div>`).join('')}
function exportExcel(){const rows=[['품번','품명','제조사','위치','비고'],...items.map(x=>[x.part,x.name,x.maker,x.location,x.note])];const h='<html><head><meta charset="utf-8"></head><body><table border="1">'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';const b=new Blob(['\ufeff',h],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MIRIM_WMS_'+new Date().toISOString().slice(0,10)+'.xls';a.click()}
function importCSV(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const lines=r.result.split(/\r?\n/).filter(Boolean);const p=lines.slice(1).map(line=>{const c=line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));return{part:c[0]||'',name:c[1]||'확인 필요',maker:c[2]||'확인 필요',location:c[3]||'',note:c[4]||''}}).filter(x=>x.part&&x.location);if(confirm(p.length+'개 품목을 추가/갱신할까요?')){p.forEach(x=>{const i=items.findIndex(v=>v.part.toLowerCase()===x.part.toLowerCase());if(i>=0)items[i]=x;else items.push(x)});persist();renderAdmin();searchItems();alert('완료')}};r.readAsText(f,'utf-8');e.target.value=''}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchItems()});searchItems();
</script></body></html>
