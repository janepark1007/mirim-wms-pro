<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자재관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}
header{background:#fff;padding:20px 16px;border-bottom:1px solid #e5e7eb;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#6b7280;font-size:14px}
main{max-width:820px;margin:0 auto;padding:18px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.menu button{border:0;border-radius:18px;padding:28px 12px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px #00000012}
.in{background:#dff6e8}.out{background:#ffe2e2}.loc{background:#eee6ff}
.panel{display:none;background:#fff;margin-top:18px;padding:18px;border-radius:18px;box-shadow:0 3px 12px #0000000d}
.panel.active{display:block}
h2{margin:0 0 14px;font-size:21px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:17px}
.action{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:800}
.result{margin-top:14px;padding:14px;background:#f7f7f8;border-radius:12px;line-height:1.65}
.small{font-size:13px;color:#6b7280;margin-top:8px}
@media(max-width:650px){
 main{padding:14px}
 .menu{grid-template-columns:1fr}
 .menu button{padding:24px 12px}
 header h1{font-size:22px}
}
</style>
</head>
<body>
<header><h1>자재관리</h1><p>입고 · 출고 · 위치조회</p></header>
<main>
  <section class="menu">
    <button class="in" onclick="openPanel('inbound')">📥 입고</button>
    <button class="out" onclick="openPanel('outbound')">📤 출고</button>
    <button class="loc" onclick="openPanel('location')">📍 위치조회</button>
  </section>

  <section id="inbound" class="panel">
    <h2>📥 입고</h2>
    <label>품번</label><input id="inPart" autocomplete="off">
    <label>입고수량</label><input id="inQty" type="number" min="1">
    <label>자재위치</label><input id="inLoc" placeholder="예: 1층 A-12">
    <button class="action" onclick="saveInbound()">입고 등록</button>
    <div id="inMsg" class="small"></div>
  </section>

  <section id="outbound" class="panel">
    <h2>📤 출고</h2>
    <label>품번</label><input id="outPart" autocomplete="off">
    <label>출고수량</label><input id="outQty" type="number" min="1">
    <button class="action" onclick="saveOutbound()">출고 등록</button>
    <div id="outMsg" class="small"></div>
  </section>

  <section id="location" class="panel">
    <h2>📍 위치조회</h2>
    <label>품번</label><input id="findPart" autocomplete="off" placeholder="품번 입력">
    <button class="action" onclick="findItem()">조회</button>
    <div id="findResult" class="result">품번을 입력해 주세요.</div>
  </section>
</main>
<script>
const KEY='simple_material_inventory_v1';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function saveDB(db){localStorage.setItem(KEY,JSON.stringify(db))}
function clean(v){return String(v||'').trim()}
function openPanel(id){
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function saveInbound(){
 const part=clean(inPart.value), qty=Number(inQty.value), loc=clean(inLoc.value);
 if(!part||!Number.isFinite(qty)||qty<=0){inMsg.textContent='품번과 입고수량을 확인해 주세요.';return}
 const db=loadDB(), item=db[part]||{qty:0,location:''};
 item.qty=Number(item.qty||0)+qty;
 if(loc)item.location=loc;
 db[part]=item; saveDB(db);
 inMsg.textContent=`등록완료 · 현재수량 ${item.qty} · 위치 ${item.location||'미등록'}`;
 inQty.value='';
}
function saveOutbound(){
 const part=clean(outPart.value), qty=Number(outQty.value);
 if(!part||!Number.isFinite(qty)||qty<=0){outMsg.textContent='품번과 출고수량을 확인해 주세요.';return}
 const db=loadDB(), item=db[part];
 if(!item){outMsg.textContent='등록되지 않은 품번입니다.';return}
 if(Number(item.qty||0)<qty){outMsg.textContent=`출고 불가 · 현재수량 ${item.qty||0}`;return}
 item.qty=Number(item.qty||0)-qty; db[part]=item; saveDB(db);
 outMsg.textContent=`등록완료 · 현재수량 ${item.qty}`;
 outQty.value='';
}
function findItem(){
 const part=clean(findPart.value), db=loadDB(), item=db[part];
 if(!part){findResult.textContent='품번을 입력해 주세요.';return}
 if(!item){findResult.innerHTML='<b>등록된 자재가 없습니다.</b>';return}
 findResult.innerHTML=`<b>품번</b> ${part}<br><b>현재수량</b> ${item.qty||0}<br><b>자재위치</b> ${item.location||'미등록'}`;
}
document.getElementById('findPart').addEventListener('keydown',e=>{if(e.key==='Enter')findItem()});
openPanel('location');
</script>
</body>
</html>
