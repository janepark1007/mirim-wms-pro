<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자재관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#202124}
header{background:#fff;padding:20px 16px;border-bottom:1px solid #e5e7eb;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#6b7280;font-size:14px}
main{max-width:820px;margin:0 auto;padding:18px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.menu button{border:0;border-radius:18px;padding:28px 12px;font-size:21px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px #00000012}
.in{background:#dff6e8}.out{background:#ffe2e2}.loc{background:#eee6ff}
.panel{display:none;background:#fff;margin-top:18px;padding:18px;border-radius:18px;box-shadow:0 3px 12px #0000000d}
.panel.active{display:block}
h2{margin:0 0 14px;font-size:21px}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:17px}
.action{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:17px;font-weight:800}
.result{margin-top:14px;padding:14px;background:#f7f7f8;border-radius:12px;line-height:1.65}
.small{font-size:13px;color:#6b7280;margin-top:8px}
@media(max-width:650px){
 main{padding:14px}
 .menu{grid-template-columns:1fr}
 .menu button{padding:24px 12px}
 header h1{font-size:22px}
}
</style>

<style id="erp-auto-search-style">
.search-wrap{position:relative}
.suggest{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid #d1d5db;border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 22px #0002}
.suggest.show{display:block}
.suggest button{display:block;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;padding:11px;text-align:left;font-size:14px}
.suggest button:last-child{border-bottom:0}
.suggest b{font-size:15px}
.erp-info{margin-top:7px;font-size:13px;color:#5f6368}
</style>
</head>
<body>
<header><h1>자재관리</h1><p>입고 · 출고 · 위치조회</p></header>
<main>
  <section class="menu">
    <button class="in" onclick="openPanel('inbound')">📥 입고</button>
    <button class="out" onclick="openPanel('outbound')">📤 출고</button>
    <button class="loc" onclick="openPanel('location')">📍 위치조회</button>
  </section>

  <section id="inbound" class="panel">
    <h2>📥 입고</h2>
    <label>품번</label><div class="search-wrap"><input id="inPart" autocomplete="off" placeholder="ERP 품번 또는 품명 입력"><div id="inSuggest" class="suggest"></div></div><div id="inErpInfo" class="erp-info"></div>
    <label>입고수량</label><input id="inQty" type="number" min="1">
    <label>자재위치</label><input id="inLoc" placeholder="예: 1층 A-12">
    <button class="action" onclick="saveInbound()">입고 등록</button>
    <div id="inMsg" class="small"></div>
  </section>

  <section id="outbound" class="panel">
    <h2>📤 출고</h2>
    <label>품번</label><div class="search-wrap"><input id="outPart" autocomplete="off" placeholder="ERP 품번 또는 품명 입력"><div id="outSuggest" class="suggest"></div></div><div id="outErpInfo" class="erp-info"></div>
    <div id="outLocationInfo" class="result" style="margin-top:10px">자재위치: 품번을 선택해 주세요.</div>
    <label>출고수량</label><input id="outQty" type="number" min="1">
    <button class="action" onclick="saveOutbound()">출고 등록</button>
    <div id="outMsg" class="small"></div>
  </section>

  <section id="location" class="panel">
    <h2>📍 위치조회</h2>
    <label>품번</label><div class="search-wrap"><input id="findPart" autocomplete="off" placeholder="ERP 품번 또는 품명 입력"><div id="findSuggest" class="suggest"></div></div><div id="findErpInfo" class="erp-info"></div>
    <button class="action" onclick="findItem()">조회</button>
    <div id="findResult" class="result">품번을 입력해 주세요.</div>
    <div id="recentHistory" class="result" style="margin-top:14px"></div>
  </section>
</main>
<script>
const KEY='simple_material_inventory_v1';

const HISTORY_KEY='simple_material_history_v1';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return []}}
function addHistory(type,part,qty,location,currentQty){
 const h=loadHistory();
 h.unshift({type,part,qty,location,currentQty,time:new Date().toLocaleString('ko-KR')});
 localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,50)));
 renderHistory();
}
function renderHistory(){
 const el=document.getElementById('recentHistory'); if(!el)return;
 const h=loadHistory().slice(0,10);
 if(!h.length){el.innerHTML='<b>최근 입고·출고 내역</b><br>등록된 내역이 없습니다.';return}
 el.innerHTML='<b>최근 입고·출고 내역</b><br>'+
 h.map(x=>`${x.time} · <b>${x.type}</b> · ${x.part} · ${x.qty}개 · 현재 ${x.currentQty}개 · ${x.location}`).join('<br>');
}
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function saveDB(db){localStorage.setItem(KEY,JSON.stringify(db))}
function clean(v){return String(v||'').trim()}
function openPanel(id){
 document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function saveInbound(){
 const part=clean(inPart.value), qty=Number(inQty.value), loc=clean(inLoc.value);
 if(!part||!Number.isFinite(qty)||qty<=0){inMsg.textContent='품번과 입고수량을 확인해 주세요.';return}
 const db=loadDB(), item=db[part]||{qty:0,location:'',totalIn:0,totalOut:0};
 item.totalIn=Number(item.totalIn||0)+qty;
 item.totalOut=Number(item.totalOut||0);
 item.qty=Number(item.totalIn)-Number(item.totalOut);
 if(loc)item.location=loc;
 db[part]=item; saveDB(db);
 addHistory('입고',part,qty,item.location||'미등록',item.qty);
 inMsg.textContent=`등록완료 · 현재수량 ${item.qty} · 위치 ${item.location||'미등록'}`;
 inQty.value='';
}
function saveOutbound(){
 const part=clean(outPart.value), qty=Number(outQty.value);
 if(!part||!Number.isFinite(qty)||qty<=0){outMsg.textContent='품번과 출고수량을 확인해 주세요.';return}
 const db=loadDB(), item=db[part];
 if(!item){outMsg.textContent='등록되지 않은 품번입니다.';return}
 if(Number(item.qty||0)<qty){outMsg.textContent=`출고 불가 · 현재수량 ${item.qty||0}`;return}
 item.totalIn=Number(item.totalIn||item.qty||0);
 item.totalOut=Number(item.totalOut||0)+qty;
 item.qty=Number(item.totalIn)-Number(item.totalOut);
 db[part]=item; saveDB(db);
 addHistory('출고',part,qty,item.location||'미등록',item.qty);
 outMsg.textContent=`등록완료 · 현재수량 ${item.qty}`;
 outQty.value='';
}
function findItem(){
 const part=clean(findPart.value), db=loadDB(), item=db[part];
 if(!part){findResult.textContent='품번을 입력해 주세요.';return}
 if(!item){findResult.innerHTML='<b>등록된 자재가 없습니다.</b>';return}
 findResult.innerHTML=`<b>품번</b> ${part}<br><b>현재수량</b> ${item.qty||0}<br><b>자재위치</b> ${item.location||'미등록'}`;
}
document.getElementById('findPart').addEventListener('keydown',e=>{if(e.key==='Enter')findItem()});
renderHistory();
openPanel('location');
</script>

function erpNorm(v){return String(v||'').trim().toLowerCase()}
function erpFindExact(code){return ERP_ITEMS.find(x=>x.code===String(code||'').trim())}

function bindErpSearch(inputId,boxId,infoId){
 const input=document.getElementById(inputId), box=document.getElementById(boxId), info=document.getElementById(infoId);
 if(!input||!box)return;
 function choose(x){
   input.value=x.code;
   box.classList.remove('show');
   info.textContent=(x.name||'')+' · ERP재고 '+x.erpQty;
 }
 function search(){
   const q=erpNorm(input.value);
   info.textContent='';
   if(!q){box.classList.remove('show');box.innerHTML='';return}
   const exact=ERP_ITEMS.find(x=>erpNorm(x.code)===q);
   if(exact){choose(exact);return}
   const arr=ERP_ITEMS.filter(x=>erpNorm(x.code).includes(q)||erpNorm(x.name).includes(q)).slice(0,15);
   box.innerHTML='';
   arr.forEach(x=>{
     const b=document.createElement('button');
     b.type='button';
     b.innerHTML='<b>'+x.code+'</b><br>'+String(x.name||'').replace(/</g,'&lt;')+' · ERP '+x.erpQty;
     b.onclick=()=>choose(x);
     box.appendChild(b);
   });
   box.classList.toggle('show',arr.length>0);
 }
 input.addEventListener('input',search);
 input.addEventListener('focus',search);
 input.addEventListener('change',()=>{
   const x=erpFindExact(input.value);
   if(x)choose(x);
 });
 document.addEventListener('click',e=>{if(!input.parentElement.contains(e.target))box.classList.remove('show')});
}

window.addEventListener('load',()=>{
 bindErpSearch('inPart','inSuggest','inErpInfo');
 bindErpSearch('outPart','outSuggest','outErpInfo');
 bindErpSearch('findPart','findSuggest','findErpInfo');
});
</script>

<script id="outbound-location-display-script">
(function(){
 function showOutboundLocation(){
   const input=document.getElementById('outPart');
   const el=document.getElementById('outLocationInfo');
   if(!input||!el)return;
   const part=String(input.value||'').trim();
   if(!part){el.textContent='자재위치: 품번을 선택해 주세요.';return}
   const db=loadDB();
   const item=db[part];
   el.innerHTML='<b>자재위치</b> '+(item&&item.location ? item.location : '미등록')+
                (item ? '<br><b>현재수량</b> '+Number(item.qty||0) : '');
 }
 const input=document.getElementById('outPart');
 if(input){
   input.addEventListener('input',()=>setTimeout(showOutboundLocation,0));
   input.addEventListener('change',()=>setTimeout(showOutboundLocation,0));
   input.addEventListener('click',()=>setTimeout(showOutboundLocation,0));
 }
 document.addEventListener('click',e=>{
   if(e.target.closest && e.target.closest('#outSuggest button'))setTimeout(showOutboundLocation,0);
 });
 window.showOutboundLocation=showOutboundLocation;
})();
</script>

<script id="total-in-out-qty-script">
(function(){
 function totals(item){
   if(!item)return {tin:0,tout:0,now:0};
   const tin=Number(item.totalIn!=null?item.totalIn:item.qty||0);
   const tout=Number(item.totalOut||0);
   return {tin,tout,now:tin-tout};
 }
 function showLookupTotals(){
   const input=document.getElementById('findPart'), el=document.getElementById('findResult');
   if(!input||!el)return;
   const part=String(input.value||'').trim();
   if(!part){el.textContent='품번을 입력해 주세요.';return}
   const item=loadDB()[part], x=totals(item);
   el.innerHTML='<b>품번</b> '+part+
     '<br><b>자재위치</b> '+(item&&item.location?item.location:'미등록')+
     '<br><b>총 입고수량</b> '+x.tin+
     '<br><b>총 출고수량</b> '+x.tout+
     '<br><b>현재수량</b> '+x.now;
 }
 function showOutboundTotals(){
   const input=document.getElementById('outPart'), el=document.getElementById('outLocationInfo');
   if(!input||!el)return;
   const part=String(input.value||'').trim();
   if(!part){el.textContent='자재위치: 품번을 선택해 주세요.';return}
   const item=loadDB()[part], x=totals(item);
   el.innerHTML='<b>자재위치</b> '+(item&&item.location?item.location:'미등록')+
     '<br><b>총 입고수량</b> '+x.tin+
     '<br><b>총 출고수량</b> '+x.tout+
     '<br><b>현재수량</b> '+x.now;
 }
 window.findItem=showLookupTotals;
 window.showOutboundLocation=showOutboundTotals;
 ['input','change'].forEach(ev=>{
   document.getElementById('findPart')?.addEventListener(ev,()=>setTimeout(showLookupTotals,0));
   document.getElementById('outPart')?.addEventListener(ev,()=>setTimeout(showOutboundTotals,0));
 });
 document.addEventListener('click',e=>{
   if(e.target.closest?.('#findSuggest button'))setTimeout(showLookupTotals,0);
   if(e.target.closest?.('#outSuggest button'))setTimeout(showOutboundTotals,0);
 });
})();
</script>
