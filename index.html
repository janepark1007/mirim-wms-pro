<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRIM WMS PRO - Shared</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;background:#f3f6fb;color:#111827}
header{background:#17357a;color:#fff;padding:25px}main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #00000012}
input,select,button{padding:12px;border-radius:12px;border:1px solid #cbd5e1;font-size:16px}
button{background:#2563eb;color:#fff;border:0;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.item{border-bottom:1px solid #e5e7eb;padding:12px 0}.muted{color:#64748b;font-size:13px}.bad{color:#b91c1c;font-weight:800}
</style></head>
<body><header><h2>📦 MIRIM WMS PRO · 공용 데이터베이스형</h2></header>
<main>
<div id="setup" class="card bad">config.js에 Supabase URL과 publishable key를 입력해야 합니다.</div>
<div class="card"><div class="row"><input id="q" placeholder="품번·품명 검색"><button id="search">검색</button></div></div>
<div id="results"></div>
<div class="card">
<h3>🚚 빠른 출고</h3>
<div class="row"><select id="user"></select><input id="pin" type="password" inputmode="numeric" placeholder="개인 PIN"></div>
<div class="row" style="margin-top:8px"><select id="item"></select><select id="location"></select></div>
<div class="row" style="margin-top:8px"><input id="qty" type="number" min="1" placeholder="출고수량"><input id="note" placeholder="비고"></div>
<button id="out" style="width:100%;margin-top:8px">출고 저장</button>
<div id="msg" class="muted" style="margin-top:8px"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
const cfg=window.MIRIM_SUPABASE||{};
if(!cfg.url||cfg.url.includes('YOUR_')) throw new Error('Supabase config missing');
const db=supabase.createClient(cfg.url,cfg.publishableKey);
setup.textContent='✅ 공용 데이터베이스 연결 준비됨';setup.classList.remove('bad');

let items=[];
async function load(){
 const [{data:i,error:ie},{data:u,error:ue}]=await Promise.all([
  db.from('items').select('id,part_no,item_name,category,unit,min_stock,photo_url,item_locations(id,location_display,qty)').eq('is_active',true).order('part_no'),
  db.rpc('list_outbound_users')
 ]);
 if(ie||ue){msg.textContent='불러오기 오류: '+(ie?.message||ue?.message);return}
 items=i||[];
 user.innerHTML=(u||[]).map(x=>`<option value="${x.id}">${x.display_name}</option>`).join('');
 item.innerHTML=items.map(x=>`<option value="${x.id}">${x.part_no} · ${x.item_name}</option>`).join('');
 updateLocations(); render(items);
}
function updateLocations(){
 const x=items.find(v=>v.id===item.value)||items[0];
 location.innerHTML=(x?.item_locations||[]).map(l=>`<option value="${l.id}">${l.location_display} · ${l.qty} ${x.unit}</option>`).join('');
}
function render(list){
 results.innerHTML=list.map(x=>{
  const total=(x.item_locations||[]).reduce((s,l)=>s+Number(l.qty||0),0);
  const locs=(x.item_locations||[]).map(l=>`${l.location_display}: ${l.qty} ${x.unit}`).join('<br>');
  return `<div class="card item"><b>${x.part_no} · ${x.item_name}</b><div>${locs}</div><div><b>현재고 합계 ${total} ${x.unit}</b></div></div>`;
 }).join('');
}
search.onclick=()=>{const k=q.value.trim().toLowerCase();render(items.filter(x=>(x.part_no+' '+x.item_name).toLowerCase().includes(k)))};
item.onchange=updateLocations;
out.onclick=async()=>{
 msg.textContent='처리 중...';
 const x=items.find(v=>v.id===item.value), n=Number(qty.value);
 if(!x||!location.value||!n||n<=0){msg.textContent='❌ 품목·위치·수량을 확인하세요.';return}
 const {error}=await db.rpc('apply_outbound_movement',{
  p_item_id:x.id,p_location_id:location.value,p_qty:n,p_user_id:user.value,
  p_pin:pin.value,p_note:note.value||null
 });
 if(error){
  if(error.message.includes('INVALID_USER_OR_PIN')) msg.textContent='❌ 담당자 PIN이 맞지 않습니다.';
  else if(error.message.includes('INSUFFICIENT_STOCK')) msg.textContent='❌ 선택 위치의 재고가 부족합니다.';
  else msg.textContent='❌ '+error.message;
  return;
 }
 msg.textContent='✅ 출고 저장 완료';pin.value='';qty.value='';note.value='';await load();
};
db.channel('mirim-live').on('postgres_changes',{event:'*',schema:'public',table:'item_locations'},load).subscribe();
load();
</script></body></html>
