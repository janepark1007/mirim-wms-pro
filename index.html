<div class="order-required-grid">
  <label style="grid-column:1/-1">ERP / 엑셀 품목 검색
    <input id="standaloneOrderSearch" autocomplete="off"
           placeholder="품번 또는 품명을 검색하세요"
           oninput="renderStandaloneOrderSearch()">
  </label>
</div>

<div id="standaloneOrderSearchList" class="order-search-list"></div>
<div id="standaloneOrderSelected" class="order-selected-box hidden"></div>

<input id="standaloneOrderPart" type="hidden">
<input id="standaloneOrderSpec" type="hidden">
<input id="standaloneOrderPhotoUrl" type="hidden">

<div class="order-required-grid">
  <label>품명 <b class="req">(필수)</b>
    <input id="standaloneOrderName" autocomplete="off" placeholder="주문할 품명을 입력하세요">
  </label>
  <label>요청수량 <b class="req">(필수)</b>
    <input id="standaloneOrderQty" type="number" min="1" inputmode="numeric" placeholder="예: 100">
  </label>
</div>

<label class="order-note-label">추가주문내용 <b class="req">(필수)</b>
  <textarea id="standaloneOrderNote" rows="4" placeholder="규격, 제조사, 사용처, 긴급 여부 등 필요한 내용을 입력하세요"></textarea>
</label>

<label class="order-note-label">사진 첨부 (ERP 미등록 품목 또는 현장 사진)
  <input id="standaloneOrderPhoto" type="file" accept="image/*" capture="environment"
         onchange="previewStandaloneOrderPhoto()">
</label>

<div id="standaloneOrderPhotoPreview" class="hidden" style="margin-top:8px"></div>

<label>요청자
  <input id="standaloneOrderWorker" readonly placeholder="로그인 작업자 자동입력">
</label>
